<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerador de Cores</title>
  <link rel="stylesheet" href="styles.css"> 

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Italiana&display=swap" rel="stylesheet">

</head>
<body>

 <header>
    <div id="header">
        <div class="logo-area" style="display: flex; align-items: center; gap: 10px;">
           
            <a href="index.html">
                <img class="logo" src="imagens/logo.png" alt="logo do site">
            </a>

            <p class="plogo" style="margin: 0; font-size: 25px;">ByteBox</p>
        </div>

        <p id="autores">Marina Navas e Larah Silva</p>
    </div>
</header>

  <main>
    <h1>Gerador de Cores</h1>
  </main>

<main class="container-gerador">
    <div class="card-cor">
      <div class="display-cor" id="displayCor"></div>

      <div class="info-cor">
        <span class="codigo-hex" id="codigoHex">#000000</span>
        <button class="btn-copiar" id="btnCopiar">Copiar</button>
      </div>

      <button class="btn-gerar" id="btnGerar">Gerar Nova Cor</button>
    </div>
  </main>
    <script src="script.js"></script>

</html>
